name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefix src

      - name: Run linter
        run: npm run lint --prefix src

      - name: Run type checker
        run: npm run typecheck --prefix src

      - name: Run tests with coverage
        run: npm run test:ci --prefix src
        env:
          CI: true

      - name: Enforce coverage threshold (70%)
        run: |
          cd src
          COVERAGE=$(cat coverage/coverage-final.json | jq '.total.statements.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 70% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets 70% threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./src/coverage/coverage-final.json
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefix src

      - name: Build application
        run: npm run build --prefix src

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefix src

      - name: Run npm audit
        run: npm audit --prefix src --audit-level=high
        continue-on-error: true

      - name: Install and run npm-audit-fix
        run: npx npm-audit-fix --prefix src
        continue-on-error: true

